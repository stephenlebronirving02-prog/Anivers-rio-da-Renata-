<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teste - Renata ❤️</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #7B2EFF,
                    #050505 55%
                );

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;

        }

        .box {

            width: 100%;

            max-width: 360px;

            padding: 35px 25px;

            border-radius: 25px;

            background: rgba(255,255,255,.08);

            border: 1px solid rgba(255,255,255,.2);

            box-shadow:
                0 0 40px rgba(123,46,255,.4);

        }

        h1 {

            font-size: 28px;

            margin-bottom: 15px;

        }

        p {

            color: #ccc;

            line-height: 1.6;

        }

        .heart {

            font-size: 60px;

            margin-bottom: 20px;

        }

    </style>

</head>

<body>

    <div class="box">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Funcionou!
        </h1>

        <p>
            A página HTML está abrindo
            corretamente.
        </p>

    </div>

</body>

</html>
