<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feliz Aniversário, Renata ❤️</title>
<meta name="theme-color" content="#030308">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#030308; color:#fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

/* FUNDO CINEMATOGRÁFICO COM NEBULA & LUZES */
.background { position:fixed; inset:0; z-index:0; background: radial-gradient(circle at 50% 50%, #0c081e 0%, #030308 100%); }
.background::before { content:""; position:absolute; width:450px; height:450px; top:-150px; left:-100px; border-radius:50%; background:#7B2EFF; filter:blur(140px); opacity:.45; animation: pulseGlow 8s ease-in-out infinite alternate; }
.background::after { content:""; position:absolute; width:450px; height:450px; right:-150px; bottom:-150px; border-radius:50%; background:#2D8CFF; filter:blur(140px); opacity:.4; animation: pulseGlow 8s ease-in-out infinite alternate-reverse; }

@keyframes pulseGlow { 0% { transform: scale(1) translate(0, 0); opacity: 0.35; } 100% { transform: scale(1.2) translate(30px, -20px); opacity: 0.55; } }

/* ELEMENTOS FLUTUANTES (ELOGIOS E EMOJIS CINEMATOGRÁFICOS) */
#falling { position:fixed; inset:0; pointer-events:none; z-index:2; }
.falling-item {
    position:absolute; top:-60px; white-space:nowrap;
    font-weight: 700; color: #ffffff;
    text-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 25px #7B2EFF, 0 0 40px #2D8CFF;
    filter: drop-shadow(0 0 8px rgba(123,46,255,0.8));
    animation: falling linear forwards;
    letter-spacing: 0.5px;
}
@keyframes falling {
    0% { transform: translateY(-60px) rotate(0deg) scale(0.9); opacity: 0; }
    15% { opacity: 1; transform: translateY(10vh) rotate(var(--rotation)) scale(1.1); }
    85% { opacity: 0.9; }
    100% { transform: translate(var(--side), 110vh) rotate(calc(var(--rotation) * 2)) scale(0.95); opacity: 0; }
}

/* CONTEÚDO CENTRAL */
.loading-content { position:relative; z-index:5; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-center:center; padding:20px; text-align:center; }
.loading-title { margin-bottom:12px; font-size:24px; font-weight:700; letter-spacing:.5px; animation: breathing 3s ease-in-out infinite; text-shadow: 0 0 15px rgba(123,46,255,0.9), 0 0 30px rgba(45,140,255,0.5); }
.loading-subtitle { max-width:320px; margin-bottom:24px; font-size:13px; line-height:1.5; color:rgba(255,255,255,.65); text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

@keyframes breathing { 0%, 100% { opacity:.85; transform:scale(1); } 50% { opacity:1; transform:scale(1.03); } }

/* MOBLILE FRAME MODERNO COM GLASSMORPHISM */
.phone {
    position:relative; width:220px; height:415px; padding:8px; border-radius:38px;
    background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(20,20,30,0.8), rgba(255,255,255,0.05));
    backdrop-filter: blur(15px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 35px rgba(123,46,255,0.4), 0 0 70px rgba(45,140,255,0.25);
    border: 1px solid rgba(255,255,255,0.18);
}
.phone-border { width:100%; height:100%; padding:3px; border-radius:32px; background:#000; }
.phone-screen { position:relative; width:100%; height:100%; overflow:hidden; border-radius:28px; background:#000; display:flex; align-items:center; justify-content:center; }
#loading-photo { width:100%; height:100%; object-fit:cover; display:block; opacity:1; transition: opacity .3s ease, transform .3s ease; }
.photo-change { opacity:0 !important; transform:scale(1.06); }
.phone-screen::after { content:""; position:absolute; inset:0; pointer-events:none; background: linear-gradient(125deg, rgba(255,255,255,0.12) 0%, transparent 40%, transparent 70%, rgba(255,255,255,0.04) 100%); }
.notch { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:70px; height:18px; border-radius:20px; background:#000; z-index:3; }

/* BARRA DE PROGRESSO NEON */
.loading-area { width:260px; max-width:90vw; margin-top:25px; }
.loading-bar { width:100%; height:8px; overflow:hidden; border-radius:20px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(5px); }
#loading-fill { width:0%; height:100%; border-radius:20px; background: linear-gradient(90deg, #7B2EFF, #00D2FF, #2D8CFF); box-shadow: 0 0 12px #7B2EFF, 0 0 20px #00D2FF; }
#loading-percent { display:block; margin-top:10px; font-size:12px; font-weight:600; color:rgba(255,255,255,.7); letter-spacing:1px; }

#transition { position:fixed; inset:0; z-index:50; background:#030308; opacity:0; pointer-events:none; transition: opacity 1s ease; }
#transition.active { opacity:1; }
</style>
</head>
<body>

<div class="background"></div>
<div id="falling"></div>
<div id="transition"></div>

<main class="loading-content">
    <h1 class="loading-title">Carregando memórias... ❤️</h1>
    <p class="loading-subtitle">Reunindo momentos especiais antes de começar a surpresa...</p>

    <div class="phone">
        <div class="phone-border">
            <div class="phone-screen">
                <div class="notch"></div>
                <img id="loading-photo" src="Fotos/foto1.jpg" alt="Memória especial">
            </div>
        </div>
    </div>

    <div class="loading-area">
        <div class="loading-bar"><div id="loading-fill"></div></div>
        <span id="loading-percent">0%</span>
    </div>
</main>

<script>
const TOTAL_TIME = 10000, TOTAL_PHOTOS = 10;
const photo = document.getElementById("loading-photo");
const fill = document.getElementById("loading-fill");
const percent = document.getElementById("loading-percent");
const transition = document.getElementById("transition");
const falling = document.getElementById("falling");

const photos = Array.from({length: TOTAL_PHOTOS}, (_, i) => `Fotos/foto${i + 1}.jpg`);
photos.forEach(src => { const img = new Image(); img.src = src; });

let currentPhoto = 0;
const photoTimer = setInterval(() => {
    currentPhoto++;
    if (currentPhoto < TOTAL_PHOTOS) {
        photo.classList.add("photo-change");
        setTimeout(() => {
            photo.src = photos[currentPhoto];
            photo.classList.remove("photo-change");
        }, 150);
    }
}, 1000);

const startTime = performance.now();
function updateLoading(currentTime) {
    const elapsed = currentTime - startTime;
    let progress = Math.min(elapsed / TOTAL_TIME, 1);
    const percentage = Math.floor(progress * 100);

    fill.style.width = percentage + "%";
    percent.textContent = percentage + "%";

    if (progress < 1) {
        requestAnimationFrame(updateLoading);
    } else {
        clearInterval(photoTimer);
        setTimeout(() => {
            transition.classList.add("active");
            setTimeout(() => { window.location.href = "fotos.html"; }, 1000);
        }, 250);
    }
}
requestAnimationFrame(updateLoading);

const fallingWords = ["meu bem","amor","vida","linda","princesa","benzinho","mozão","amorzin","meu amor","mor"];
const fallingEmojis = ["❤️","💜","💙","🤍","💕","✨"];

function createFallingItem() {
    const item = document.createElement("span");
    item.className = "falling-item";
    const isEmoji = Math.random() < 0.5;
    item.textContent = isEmoji 
        ? fallingEmojis[Math.floor(Math.random() * fallingEmojis.length)]
        : fallingWords[Math.floor(Math.random() * fallingWords.length)];

    item.style.left = Math.random() * 92 + 4 + "%";
    item.style.fontSize = (isEmoji ? (22 + Math.random() * 12) : (18 + Math.random() * 10)) + "px";
    item.style.animationDuration = (4.5 + Math.random() * 4) + "s";
    item.style.setProperty("--side", (-50 + Math.random() * 100) + "px");
    item.style.setProperty("--rotation", (-30 + Math.random() * 60) + "deg");

    falling.appendChild(item);
    setTimeout(() => item.remove(), 8500);
}

const fallingInterval = setInterval(createFallingItem, 280);
setTimeout(() => clearInterval(fallingInterval), TOTAL_TIME);
</script>
</body>
</html>
