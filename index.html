<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Feliz Aniversário, Renata ❤️</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

/* FUNDO */

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,
    rgba(123,46,255,.35),
    transparent 35%),
    radial-gradient(circle at 80% 80%,
    rgba(45,140,255,.25),
    transparent 35%),
    #050505;
}

/* ELEMENTOS CAINDO */

#fall{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.fall{
    position:absolute;
    top:-40px;
    animation:cair linear forwards;
    opacity:.6;
    text-shadow:0 0 10px #7B2EFF;
}

@keyframes cair{
    to{
        transform:
        translateY(110vh)
        rotate(180deg);
        opacity:0;
    }
}

/* CONTEÚDO */

.main{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* CELULAR */

.phone{
    width:210px;
    height:390px;
    padding:7px;
    border-radius:30px;
    background:
    linear-gradient(135deg,
    #222,#777,#222);
    box-shadow:
    0 0 35px rgba(123,46,255,.5),
    0 20px 50px #000;
}

.screen{
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:24px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.screen img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* TEXTO */

.title{
    margin-bottom:18px;
    font-size:20px;
    text-align:center;
    animation:brilho 2s infinite;
}

@keyframes brilho{
    50%{
        text-shadow:0 0 15px #7B2EFF;
    }
}

/* BARRA */

.loading{
    width:260px;
    margin-top:22px;
}

.bar{
    height:8px;
    border-radius:20px;
    background:#222;
    overflow:hidden;
}

.fill{
    width:0;
    height:100%;
    background:
    linear-gradient(90deg,
    #7B2EFF,#2D8CFF);
    box-shadow:0 0 15px #7B2EFF;
}

.percent{
    display:block;
    text-align:center;
    margin-top:8px;
    font-size:12px;
    color:#aaa;
}

/* TRANSIÇÃO */

.fade{
    position:fixed;
    inset:0;
    background:#050505;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s;
}

.fade.show{
    opacity:1;
}

</style>
</head>

<body>

<div class="bg"></div>

<div id="fall"></div>

<div class="fade" id="fade"></div>

<main class="main">

    <h1 class="title">
        Carregando memórias... ❤️
    </h1>

    <div class="phone">

        <div class="screen">

            <img
            id="photo"
            src="Fotos/foto1.jpg"
            alt="Memória">

        </div>

    </div>

    <div class="loading">

        <div class="bar">

            <div
            class="fill"
            id="fill">
            </div>

        </div>

        <span
        class="percent"
        id="percent">
        0%
        </span>

    </div>

</main>

<script>

/* FOTOS */

const photo =
document.getElementById("photo");

let numero = 1;

/* TROCA DAS FOTOS */

const troca =
setInterval(function(){

    numero++;

    if(numero <= 10){

        photo.src =
        "Fotos/foto" +
        numero +
        ".jpg";

    }

},1000);


/* BARRA */

const fill =
document.getElementById("fill");

const percent =
document.getElementById("percent");

let inicio =
Date.now();

function carregar(){

    let tempo =
    Date.now()-inicio;

    let valor =
    Math.min(
        tempo/10000*100,
        100
    );

    fill.style.width =
    valor+"%";

    percent.textContent =
    Math.floor(valor)+"%";

    if(valor < 100){

        requestAnimationFrame(carregar);

    }else{

        clearInterval(troca);

        /* TRANSIÇÃO SIMPLES */

        document
        .getElementById("fade")
        .classList
        .add("show");

        setTimeout(function(){

            window.location.href =
            "fotos.html";

        },1000);

    }

}

carregar();


/* ELEMENTOS CAINDO */

const fall =
document.getElementById("fall");

const palavras = [

    "meu bem",
    "amor",
    "vida",
    "linda",
    "princesa",
    "benzinho",
    "mozão",
    "amorzin",
    "meu amor",
    "mor",
    "❤️",
    "💜",
    "💙",
    "🤍"

];

function criar(){

    const item =
    document.createElement("span");

    item.className =
    "fall";

    item.textContent =
    palavras[
    Math.floor(
    Math.random()*palavras.length
    )];

    item.style.left =
    Math.random()*100+"%";

    item.style.fontSize =
    10+Math.random()*12+"px";

    item.style.animationDuration =
    4+Math.random()*4+"s";

    fall.appendChild(item);

    setTimeout(function(){

        item.remove();

    },9000);

}

setInterval(criar,300);

</script>

</body>
</html>
